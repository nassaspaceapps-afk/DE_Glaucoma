.q":"Is there anything else about your vision that has changed?","symptom.other.alt":"A simple eye outline.","risk.title":"A little background","risk.intro":"These answers are not added up into a risk percentage. They are listed separately in your report so an eye doctor can see them. You can skip any question.","risk.age.q":"Your age range","risk.age.under40":"Under 40","risk.age.40-49":"40 to 49","risk.age.50-59":"50 to 59","risk.age.60-69":"60 to 69","risk.age.70plus":"70 or older","risk.familyGlaucoma.q":"Has a close relative (parent, brother or sister) been told they have glaucoma?","risk.knownDiagnosis.q":"Have you ever been told you have glaucoma or high eye pressure (ocular hypertension)?","risk.knownDiagnosis.note":"If you already have glaucoma, keep following your doctor\u2019s plan. This app does not replace it.","risk.surgeryOrInjury.q":"Have you had eye surgery or a serious eye injury?","risk.recentExam.q":"When was your last comprehensive eye examination?","risk.recentExam.within-year":"In the last year","risk.recentExam.1-2-years":"1 to 2 years ago","risk.recentExam.over-2-years":"More than 2 years ago","risk.recentExam.never":"Never","risk.recentExam.unsure":"Not sure","risk.recommendedTesting.q":"Has a health professional recommended extra eye tests?","risk.yes":"Yes","risk.no":"No","risk.unsure":"Not sure","risk.incomplete":"Please answer every question, or choose \u201CPrefer not to answer\u201D.","risk.continue":"Continue to preparation","prepare.title":"Get ready for the test","prepare.intro":"Read these steps once. Then try a short practice round before the real test.","prepare.step.eye.title":"One eye at a time","prepare.step.eye.body":"You will test your right eye first, then your left. Gently cover the other eye with your palm, an eye patch or an opaque card. Do not press on the eye.","prepare.step.hold.title":"Hold the phone steady","prepare.step.hold.body":"Sit down. Hold the phone about 30 cm (one forearm) from your eye, with the screen centered in front of the eye you are testing. Keep it still, or rest it on a stand. Wear your usual glasses or contact lenses.","prepare.step.center.title":"Look at the center point","prepare.step.center.body":"Keep your eye on the small point in the middle of the black screen. Do not look toward the dots, even though you will want to.","prepare.step.dots.title":"Tiny dots appear around the edges","prepare.step.dots.body":"A very small dot flashes for a moment somewhere away from the center. Some are easy to see and some are very faint.","prepare.step.answer.title":"Say yes or no","prepare.step.answer.body":"After each dot, a voice asks if you saw it. Say \u201Cyes\u201D if you did and \u201Cno\u201D if you did not. You can say \u201Cpause\u201D or \u201Cstop\u201D at any time.","prepare.step.rest.title":"Rest between blocks","prepare.step.rest.body":"There is a rest break after every 10 dots. Nothing continues until you say so.","prepare.factors.title":"What can change the result","prepare.factors.body":"Screen size, how far you hold the phone, screen brightness, display quality, room lighting and eye movements all affect what you see. This is why Bath of Light is a screening prototype and not a test.","prepare.safe.title":"Stay safe","prepare.safe.body":"Do the test seated, in a safe place. Never while walking, driving or standing. Stop whenever you want.","prepare.mic.title":"About voice answers","prepare.mic.body":"Your browser may send your speech to its own speech service to turn it into text. Bath of Light keeps only the recognized words (such as \u201Cyes\u201D) and never any audio.","prepare.mic.fallback":"If voice does not work, you can answer by tapping Yes or No, or with the keyboard (Y and N).","prepare.fullscreen.note":"The test uses a full black screen. If your browser cannot go full screen, the test still runs in the window, but results may be less reliable.","prepare.practice.title":"Practice round","prepare.practice.body":"Four clearly visible dots. Nothing from the practice is saved. Hold your phone as you will for the real test.","prepare.practice.start":"Start practice","prepare.practice.again":"Practice again","prepare.practice.done":"Practice finished","prepare.practice.result":"You gave a clear answer for {answered} of {total} dots.","prepare.practice.mic":"Voice answers did not work in practice. You can switch to tap answers in the test.","prepare.practice.skip":"Skip practice","prepare.practice.skipped":"Practice skipped","prepare.practice.needed":"Do the practice round first, or choose \u201CSkip practice\u201D, before starting the test.","prepare.consent.understand":"I understand how the test works.","prepare.consent.notDiagnosis":"I understand this is not a diagnosis and cannot rule out any eye condition.","prepare.consent.ready":"I am sitting safely and I am ready to start the test.","prepare.consent.missing":"Tick all three boxes to start.","prepare.start":"Start the test","prepare.firstEye":"Test order: {first} first, then {second}.","prepare.resume.title":"You have an unfinished test","prepare.resume.body":"Saved: {done} of {total} dots, {eye} in progress.","prepare.resume.resume":"Resume where I stopped","prepare.resume.restart":"Discard it and start over","speechCheck.title":"Microphone check","speechCheck.start":"Test my microphone","speechCheck.stop":"Stop","speechCheck.listening":"Listening\u2026 say \u201Cyes\u201D or \u201Cno\u201D.","speechCheck.heard":"Heard: \u201C{text}\u201D \u2192 understood as {intent}","speechCheck.intent.yes":"yes","speechCheck.intent.no":"no","speechCheck.intent.unsure":"not sure","speechCheck.intent.repeat":"repeat","speechCheck.intent.pause":"pause","speechCheck.intent.stop":"stop","speechCheck.intent.ready":"ready","speechCheck.intent.unclear":"unclear","speechCheck.supported":"Speech recognition is available in this browser.","speechCheck.unsupported":"Speech recognition is not available in this browser. You can still answer by tapping.","speechCheck.voiceOk r by tapping, or stop the test.","voice.problems":"I am not hearing clear answers, so the test is paused. This session may be unreliable.","results.title":"Your results","results.subtitle":"A cautious summary of what you reported and what this prototype observed.","results.demoBanner":"Demo data. This is not a real screening.","results.saved":"Saved on this device.","results.disclaimer":"This is not a medical diagnosis. Only an eye examination can find or rule out eye disease.","results.status.title":"Session status","results.status.completed":"Completed","results.status.incomplete":"Incomplete","results.status.unreliable":"Unreliable or technically invalid","results.status.completed.body":"Both eyes were tested and the data quality was good enough to describe.","results.status.incomplete.body":"Not every planned dot was completed for both eyes, so the summary below is partial.","results.status.unreliable.body":"Technical problems or unclear answers made the data unreliable, so no pattern should be read into it.","results.completion":"{percent}% of planned dots completed","results.outcome.urgent.title":"Seek urgent eye care now","results.outcome.urgent.body":"You reported warning signs that can need emergency treatment. Nothing in this screening should delay getting care.","results.outcome.known-condition.title":"Keep following your eye doctor\u2019s plan","results.outcome.known-condition.body":"You told us you have been diagnosed with glaucoma or ocular hypertension. This prototype cannot monitor or manage it, and a result that looks normal here never replaces your doctor\u2019s tests.","results.outcome.concerning.title":"Some observations are worth discussing with an eye doctor","results.outcome.concerning.body":"Your answers, or dots you did not report, suggest that arranging an eye examination would be sensible. This is not a diagnosis, and many things can cause these observations.","results.outcome.inconclusive.title":"This screening was inconclusive","results.outcome.inconclusive.body":"There was not enough reliable information to draw a useful conclusion. You can try again in a quiet, dim room, and see an eye doctor if you have concerns.","results.outcome.none-noted.title":"No obvious pattern noticed by this prototype","results.outcome.none-noted.body":"The test did not notice an obvious problem within its very limited scope. That does not establish a normal visual field and it does not rule out glaucoma, which often causes no symptoms early on. Keep having regular comprehensive eye examinations.","results.reasons.title":"Why this guidance","results.reason.emergency-symptoms":"You reported urgent warning signs.","results.reason.known-diagnosis":"You reported a previous diagnosis of glaucoma or ocular hypertension.","results.reason.eye-repeated-misses":"Several dots in the same area were not reported with {eye}.","results.reason.field-symptoms":"You reported {count} symptom(s) that involve the extent of your visual field.","results.reason.multiple-symptoms":"You reported {count} different vision symptoms.","results.reason.incomplete":"The screening was not completed for both eyes.","results.reason.unreliable":"The data quality was too low to interpret.","results.next.title":"Suggested next steps","results.next.seek-urgent-care":"Go to an emergency department or eye emergency service now.","results.next.book-ophthalmology":"Arrange an eye examination with an ophthalmologist (eye doctor).","results.next.bring-report":"Share or print the report to take to the appointment.","results.next.continue-care-plan":"Keep your scheduled appointments and treatment.","results.next.share-with-doctor":"Tell your eye doctor about these observations at your next visit, and sooner if anything changes.","results.next.repeat-screening":"You can repeat the screening in a quiet, dim room, holding the phone steady.","results.next.professional-if-persist":"If you still have concerns or symptoms, see an eye doctor rather than relying on this app." rcent}% of answers were unclear or missing.","results.quality.reason.catch-false-positives":"You said yes {count} time(s) when no dot was shown ({of} valid quality-check trials).","results.quality.reason.no-catch-trials":"No quality-check trials were included.","results.quality.reason.fixation-looked-away":"You reported looking away from the center in {count} block(s).","results.quality.reason.interruptions":"{count} dots were interrupted and had to be repeated.","results.quality.reason.viewport-changed":"The screen size changed during the test.","results.limits.title":"Limits of this screening","results.limit.fixation-unverified":"Where you looked cannot be checked by this app. Fixation is self-reported and is not eye tracking.","results.limit.uncalibrated-display":"Screen size, viewing distance and brightness were not calibrated.","results.limit.speech-fallback":"Voice recognition was not used for part of the test.","results.limit.fullscreen-unavailable":"Full screen was not available, so the test ran in the browser window.","results.limit.coverage":"Only the central part of your visual field fits on a phone screen. Areas farther out were not tested.","results.limit.experimental":"The stimulus configuration is experimental and has not been validated against clinical visual-field testing.","results.actions.report":"Open printable report","results.actions.repeat":"Repeat the screening","results.actions.history":"Go to history","results.actions.about":"Learn more about glaucoma","report.title":"Bath of Light screening report","report.banner":"Not a medical diagnosis","report.disclaimer":"This report comes from an educational, experimental screening prototype. It is not a medical diagnosis. It cannot show that you have, or do not have, glaucoma or any other eye condition. Please share it with an eye doctor and follow their advice.","report.meta.date":"Date of screening","report.meta.language":"Language used","report.meta.version":"App version","report.meta.eyes":"Eyes "Spoken question","settings.test.promptStyle.tone":"Soft tone","settings.test.preferredInput":"Preferred answer method","settings.test.preferredInput.voice":"Voice","settings.test.preferredInput.touch":"Tap","settings.test.firstEye":"First eye","settings.test.reset":"Reset to defaults","settings.test.saved":"Settings saved.","settings.demo.title":"Demo mode","settings.demo.body":"Create a clearly labeled demo result so you can explore the results page and report. Demo data is never mixed up with real screenings.","settings.demo.clean":"Add demo: no pattern noticed","settings.demo.concerning":"Add demo: unreported area","settings.data.title":"Your data","settings.data.body":"Everything is stored only in this browser. You can remove it all here.","settings.data.deleteAll":"Delete all data on this device","settings.data.deleteAll.title":"Delete everything?","settings.data.deleteAll.body":"Saved screenings, the unfinished screening and your settings will be removed from this device.","settings.data.deleted":"All data deleted.","settings.storage.unavailable":"This browser is blocking local storage, so nothing can be saved between visits.","privacy.title":"Privacy","privacy.p1":"Everything stays on this device. Bath of Light has no account and no server, and it does not send your answers anywhere.","privacy.p2":"We do not ask for your name, your location or any recordings.","privacy.p3":"We store only recognized words such as \u201Cyes\u201D or \u201Cno\u201D, with timestamps. We never record or keep audio.","privacy.p4":"Your browser\u2019s speech recognition may send audio to the browser maker\u2019s or another provider\u2019s service to turn it into text. For example, Chrome uses Google\u2019s service. That happens outside this app. If you prefer, use tap answers instead.","privacy.p5":"You can delete one screening, clear all history, or delete everything from the History and settings page.","privacy.p6":"The page uses your device\u2019s own fonts and loads nothing from third parties.","privacy.back":"Back","access.title":"Accessibility","access.intro":"Bath of Light is built so that as many people as possible can use it.","access.l1":"Large text and large buttons, with strong contrast in dark and light appearance.","access.l2":"English and Arabic, with full right-to-left layout for Arabic.","access.l3":"Everything outside the test works with a keyboard and a screen reader.","access.l4":"Questions can be read aloud, and answered by voice, by tapping or by keyboard.","access.l5":"Animations are switched off when your device asks for reduced motion.","access.l6":"You can pause or stop the test at any time by voice, button or the Escape key.","access.limits.title":"What is not accessible","access.limits.body":"The screening itself needs you to see a small dot, so people who are blind or have very low vision cannot use it. If that is you, an eye doctor can test your vision with other methods. If something is hard to use, please tell the person who gave you this prototype.","access.zoom":"You can enlarge the text with your browser\u2019s zoom. The layout adapts.","about.title":"About glaucoma and this screening","about.what.title":"What is glaucoma?","about.what.body":"Glaucoma is a group of eye conditions that damage the optic nerve, the cable that carries images from your eye to your brain. It is often linked to raised pressure inside the eye, but not always.","about.silent.title":"Why it can go unnoticed","about.silent.body":"Early glaucoma often causes no pain and no obvious symptoms. It usually affects side vision first, and your brain fills in the gaps, so many people only notice once a lot of vision has been lost. Vision that is lost cannot be restored, which is why early detection matters.","about.peripheral.title":"What is peripheral vision?","about.peripheral.body":"It is everything you see out of the corners of your eyes while looking straight ahead. You use it for walking, driving and noticing things that approach from the side.","about.cannot.title":"Why a phone cannot diagnose or rule out glaucoma","about.cannot.l1":"Phone screens differ in size and brightness, and you hold the phone at a different distance each time. Clinical visual-field machines are calibrated and used in controlled conditions.","about.cannot.l2":"Only a small central part of your visual field fits on a phone screen.","about.cannot.l3":"The app cannot check where you are looking, and speech recognition can mishear.","about.cannot.l4":"Diagnosing glaucoma needs eye pressure measurement, a look at the optic nerve and drainage angle, imaging and clinical visual-field tests.","about.exam.title":"Why a comprehensive eye examination matters","about.exam.body":"In a comprehensive exam an eye doctor can measure eye pressure and examine the optic nerve, which can reveal glaucoma before you notice any change. How often you need one depends on your age, family history and health, so ask your eye doctor.","about.urgent.title":"When to seek urgent eye care","about.urgent.l1":"Sudden loss of vision, or a new dark curtain or shadow across your vision","about.urgent.l2":"Severe eye pain","about.urgent.l3":"A red eye with blurred vision","about.urgent.l4":"Sudden blurred vision with nausea or vomiting","about.urgent.l5":"Rapidly worsening vision","about.refs.title":"Trusted sources","about.refs.note":"These sources are written in English. The summaries on this page are our own, so please check the sources or ask your eye doctor for materials in your language.","about.ref.nei.title":"National Eye Institute: Glaucoma","about.ref.nei.body":"An overview of glaucoma types, symptoms, risk factors and treatment from the US National Institutes of Health.","about.ref.aao.title":"American Academy of Ophthalmology: What is glaucoma?","about.ref.aao.body":"A patient guide to glaucoma from the professional association of eye doctors.","about.ref.vf.title":"American Academy of Ophthalmology: Visual field testing","about.ref.vf.body":"How clin
