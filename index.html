imulusDurationMs":"Dot display time (ms)","settings.test.responseWindowMs":"Time to answer (ms)","settings.test.fixationMs":"Fixation time before dots (ms)","settings.test.minGapMs":"Shortest gap between dots (ms)","settings.test.maxGapMs":"Longest gap between dots (ms)","settings.test.speechRate":"Speech speed","settings.test.promptStyle":"\u201CAnswer now\u201D cue","settings.test.promptStyle.voice":"Spoken question","settings.test.promptStyle.tone":"Soft tone","settings.test.preferredInput":"Preferred answer method","settings.test.preferredInput.voice":"Voice","settings.test.preferredInput.touch":"Tap","settings.test.firstEye":"First eye","settings.test.reset":"Reset to defaults","settings.test.saved":"Settings saved.","settings.demo.title":"Demo mode","settings.demo.body":"Create a clearly labeled demo result so you can explore the results page and report. Demo data is never mixed up with real screenings.","settings.demo.clean":"Add demo: no pattern noticed","settings.demo.concerning":"Add demo: unreported area","settings.demo.high":"Add demo: high estimate","settings.data.title":"Your data","settings.data.body":"Everything is stored only in this browser. You can remove it all here.","settings.data.deleteAll":"Delete all data on this device","settings.data.deleteAll.title":"Delete everything?","settings.data.deleteAll.body":"Saved screenings, the unfinished screening and your settings will be removed from this device.","settings.data.deleted":"All data deleted.","settings.storage.unavailable":"This browser is blocking local storage, so nothing can be saved between visits.","privacy.title":"Privacy","privacy.p1":"Everything stays on this device. DE-Glaucoma has no account and no server, and it does not send your answers anywhere.","privacy.p2":"We do not ask for your name, your location or any recordings.","privacy.p3":"We store only recognized words such as \u201Cyes\u201D or \u201Cno\u201D, with timestamps. We never record or keep audio.","privacy.p4":"Your browser\u2019s speech recognition may send audio to the browser maker\u2019s or another provider\u2019s service to turn it into text. For example, Chrome uses Google\u2019s service. That happens outside this app. If you prefer, use tap answers instead.","privacy.p5":"You can delete one screening, clear all history, or delete everything from the History and settings page.","privacy.p6":"The page uses your device\u2019s own fonts and loads nothing from third parties.","privacy.back":"Back","access.title":"Accessibility","access.intro":"DE-Glaucoma is built so that as many people as possible can use it.","access.l1":"Large text and large buttons, with strong contrast in dark and light appearance.","access.l2":"English and Arabic, with full right-to-left layout for Arabic.","access.l3":"Everything outside the test works with a keyboard and a screen reader.","access.l4":"Questions can be read aloud, and answered by voice, by tapping or by keyboard.","access.l5":"Animations are switched off when your device asks for reduced motion.","access.l6":"You can pause or stop the test at any time by voice, button or the Escape key.","access.limits.title":"What is not accessible","access.limits.body":"The screening itself needs you to see a small dot, so people who are blind or have very low vision cannot use it. If that is you, an eye doctor can test your vision with other methods. If something is hard to use, please tell the person who gave you this prototype.","access.zoom":"You can enlarge the text with your browser\u2019s zoom. The layout adapts.","about.title":"About glaucoma and this screening","about.what.title":"What is glaucoma?","about.what.body":"Glaucoma is a group of eye conditions that damage the optic nerve, the cable that carries images from your eye to your brain. It is often linked to raised pressure inside the eye, but not always.","about.silent.title":"Why it can go unnoticed","about.silent.body":"Early glaucoma often causes no pain and no obvious symptoms. It usually affects side vision first, and your brain fills in the gaps, so many people only notice once a lot of vision has been lost. Vision that is lost cannot be restored, which is why early detection matters.","about.peripheral.title":"What is peripheral vision?","about.peripheral.body":"It is everything you see out of the corners of your eyes while looking straight ahead. You use it for walking, driving and noticing things that approach from the side.","about.cannot.title":"Why a phone cannot diagnose or rule out glaucoma","about.cannot.l1":"Phone screens differ in size and brightness, and you hold the phone at a different distance each time. Clinical visual-field machines are calibrated and used in controlled conditions.","about.cannot.l2":"Only a small central part of your visual field fits on a phone screen.","about.cannot.l3":"The app cannot check where you are looking, and speech recognition can mishear.","about.cannot.l4":"Diagnosing glaucoma needs eye pressure measurement, a look at the optic nerve and drainage angle, imaging and clinical visual-field tests.","about.exam.title":"Why a comprehensive eye examination matters","about.exam.body":"In a comprehensive exam an eye doctor can measure eye pressure and examine the optic nerve, which can reveal glaucoma before you notice any change. How often you need one depends on your age, family history and health, so ask your eye doctor.","about.urgent.title":"When to seek urgent eye care","about.urgent.l1":"Sudden loss of vision, or a new dark curtain or shadow across your vision","about.urgent.l2":"Severe eye pain","about.urgent.l3":"A red eye with blurred vision","about.urgent.l4":"Sudden blurred vision with nausea or vomiting","about.urgent.l5":"Rapidly worsening vision","about.refs.title":"Trusted sources","about.refs.note":"These sources are written in English. The summaries on this page are our own, so please check the sources or ask your eye doctor for materials in your language.","about.ref.nei.title":"National Eye Institute: Glaucoma","about.ref.nei.body":"An overview of glaucoma types, symptoms, risk factors and treatment from the US National Institutes of Health.","about.ref.aao.title":"American Academy of Ophthalmology: What is glaucoma?","about.ref.aao.body":"A patient guide to glaucoma from the professional association of eye doctors.","about.ref.vf.title":"American Academy of Ophthalmology: Visual field testing","about.ref.vf.body":"How clinical visual field tests work and what they are used for.","report.meta.configValueBrief":"Dot {size} px, shown for {duration} ms, {trials} dots per eye.","verdict.urgent.title":"Get urgent eye care now","verdict.urgent.body":"You reported warning signs that can need emergency treatment. Go to an emergency department or an eye emergency service now.","verdict.known.title":"Follow your eye doctor\u2019s plan","verdict.known.body":"You told us you already have glaucoma or high eye pressure. Show this report to your doctor and keep your appointments.","verdict.healthy.title":"Looks healthy","verdict.healthy.body":"No signs of glaucoma were found in this screening. Keep having regular eye check-ups.","verdict.repeat.title":"Not certain","verdict.repeat.body":"The result is not clear enough to say. Repeat the test after one week, in the same place and at the same distance.","verdict.doctor.title":"Glaucoma is suspected","verdict.doctor.body":"The estimate is high. See an eye doctor as soon as possible and bring this report.","verdict.unreliable.title":"The test could not be read clearly","verdict.unreliable.body":"Too many answers were missing or unclear, or the test was not finished. Repeat it in a quiet, dim room, keeping the screen steady.","stats.title":"Test statistics","stats.of":"{a} of {b}","stats.tile.seen":"Dots seen","stats.tile.notSeen":"Dots not seen","stats.tile.unclear":"Unclear or no answer","stats.tile.median":"Median response time","stats.tile.mean":"Average {n}","stats.tile.duration":"Test duration","stats.unit.mi
